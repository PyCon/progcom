{%extends "base.html"%}
{%block body %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-soft">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Change Password</h2>
                <p class="text-muted text-center mb-4">Enter your new password below.</p>

                <form method="POST">
                    <div class="mb-3">
                        <label for="pw" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="pw"
                            name="pw" placeholder="Enter new password">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Save Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{%endblock body%}
