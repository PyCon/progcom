
{%extends "base.html"%}
{%block body %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="h3 mb-0">Proposals with Unread Discussions</h1>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <tbody>
                {% for u in unread %}
                <tr>
                    <td><a href="{{url_for("screening", id=u.id)}}">{{u.title}}</a></td>
                    <td class="text-muted">#{{u.id}}</td>
                </tr>
                {% else %}
                <tr><td class="text-center text-success py-4">Nothing unread!</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{%endblock body%}
